# Production Nginx site for jianglisoftware.com, including TLS, SPA isolation, and SEO routing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ jianglisoftware.com www.jianglisoftware.com;
    return 301 https://jianglisoftware.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jianglisoftware.com;
    ssl_certificate /etc/nginx/ssl/jianglisoftware.com/jianglisoftware.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/jianglisoftware.com/jianglisoftware.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:UMLSSL:10m;
    ssl_session_timeout 1d;
    return 301 https://jianglisoftware.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name jianglisoftware.com;
    ssl_certificate /etc/nginx/ssl/jianglisoftware.com/jianglisoftware.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/jianglisoftware.com/jianglisoftware.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:UMLSSL:10m;
    ssl_session_timeout 1d;

    root /www/wwwroot/uml-platform/current/apps/web/dist;
    index index.html;
    error_page 404 /404.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~ ^/(features|workflow|cases|pricing)/?$ {
        return 404;
    }

    location ~ ^/(login|register|verify-email|forgot-password|reset-password|workspace|exam|tutorial|invitations/accept|billing/alipay/return|account|account/security|settings/models|account/billing)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html /index.html =404;
    }

    location ~ ^/projects(?:/.*)?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /app.html /index.html =404;
    }

    location = /app.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /indexnow-key.txt {
        alias /www/wwwroot/uml-platform/shared/seo/indexnow-key.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        root /www/wwwroot/uml-platform/shared/web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /onlyoffice/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /cache/ {
        proxy_pass http://127.0.0.1:8080/cache/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration)(/|$) {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
